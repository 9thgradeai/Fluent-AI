name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Local/test secret only — production secrets come from Vercel.
  SESSION_SECRET: ci-secret-not-for-production-0123456789abcdef

jobs:
  test:
    name: Test, typecheck, lint, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fluentai
          POSTGRES_PASSWORD: fluentai
          POSTGRES_DB: fluentai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fluentai"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://fluentai:fluentai@localhost:5432/fluentai?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      # Validate every migration applies cleanly against a fresh database.
      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Unit tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
